<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Остров Цифриков 3D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#46372a;background:#8FD3FF;overscroll-behavior:none}
body{overflow:hidden;position:fixed;inset:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;cursor:pointer;border:0}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#8FD3FF}
#hud{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 10px) 8px calc(env(safe-area-inset-left) + 10px);pointer-events:none}
#hud .sp{flex:1}
.pill{background:#FFF8E6;border-radius:999px;padding:7px 12px;font-weight:700;font-size:15px;pointer-events:auto;cursor:pointer}
#menuBtn,#mapBtn{background:#FFF8E6;border-radius:999px;min-width:48px;min-height:40px;padding:0 14px;font-weight:700;font-size:15px;color:#46372a;pointer-events:auto}
#toast{position:fixed;left:50%;top:max(96px,calc(env(safe-area-inset-top) + 88px));transform:translateX(-50%);width:max-content;max-width:92%;background:#FFF8E6;border:3px solid #FFAA3C;border-radius:16px;padding:10px 14px;font-weight:700;font-size:16px;text-align:center;z-index:30;display:none;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(40,30,20,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:10px}
.ov.on{display:flex}
.card{position:relative;background:#FFF8E6;border:4px solid #FFAA3C;border-radius:20px;width:100%;max-width:640px;max-height:96%;overflow:auto;padding:12px 14px 14px}
#phead{display:flex;align-items:center;gap:10px}
#ptitle{font-weight:800;font-size:18px}
#pcount{font-size:13px;color:#7a6650}
#pstars{font-size:22px;color:#E6A700;letter-spacing:1px}
#close{margin-left:auto;min-height:44px;padding:0 14px;border-radius:12px;background:#EB4646;color:#fff;font-weight:700;font-size:16px}
#dots{display:flex;gap:7px;justify-content:center;margin:8px 0 2px}
.dt{width:13px;height:13px;border-radius:50%;background:#D9CDB8}
.dt.ok{background:#5AC86E}.dt.bad{background:#F09A3C}.dt.cur{background:#fff;border:3px solid #4A8BEA}
#prompt{font-size:clamp(20px,5vw,30px);font-weight:800;text-align:center;margin:8px 0;min-height:36px}
#vis{display:flex;gap:10px;justify-content:center;align-items:center;min-height:70px;flex-wrap:wrap;margin-bottom:4px}
#vis.cmp.h{flex-wrap:nowrap}
#vis.cmp.v{flex-direction:column;flex-wrap:nowrap}
.box{background:#fff;border-radius:14px;padding:6px;border:2px solid #FFD9A0;display:flex;align-items:center;justify-content:center}
#vis.cmp.h .box{flex:1;min-width:0}
.grid{display:grid;gap:4px;justify-content:center}
.it{position:relative;display:flex;align-items:center;justify-content:center;line-height:1}
.it svg{display:block}
.it b{position:absolute;bottom:-5px;right:-3px;background:#4A8BEA;color:#fff;border-radius:8px;font-size:11px;padding:0 4px}
.scatter{position:relative;width:100%;max-width:330px}
.sc{position:absolute;transform:translate(-50%,-50%)}
.blk{position:relative;border-radius:6px;background:#BE8750}
.blk.e{background:transparent;border:3px dashed #BE8750}
.blk b{position:absolute;top:-6px;right:-3px;background:#4A8BEA;color:#fff;border-radius:8px;font-size:10px;padding:0 3px}
.dot{width:34px;height:34px;border-radius:50%;border:3px solid #E94B4B}
.dot.f{background:#E94B4B}
.seqbox{min-width:46px;height:46px;border-radius:10px;background:#fff;border:2px solid #FFD9A0;font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 6px}
.seqbox.q{background:#FFE27A;border-color:#E6A700}
.coin{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;border:4px solid rgba(0,0,0,.18);color:#46372a}
.coin.c1{background:#C98B4A}.coin.c2{background:#C9CCD2}.coin.c5{background:#E3C45A}.coin.c10{background:#F0D060;border-color:#B8B8C0}
.pi svg{display:block}
.tens{display:flex;gap:8px;align-items:flex-end}
.rod{display:flex;flex-direction:column;gap:1px}
.rod i{display:block;width:14px;height:12px;background:#4A8BEA;border-radius:2px}
.ones{display:grid;grid-template-columns:repeat(5,14px);gap:2px;margin-left:12px}
.ones i{display:block;width:14px;height:14px;background:#F0A03C;border-radius:3px}
.pgrid{display:grid;gap:3px}
.pc{width:44px;height:44px;background:#fff;border:2px solid #FFD9A0;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800}
.pc.l{background:#FFE8A8;font-size:22px}
.bigemoji{font-size:60px}
#msg{min-height:40px;text-align:center;font-weight:700;font-size:clamp(15px,3.8vw,19px);margin:4px 0 8px}
#msg.good{color:#2E9B47}
#opts{display:flex;gap:10px}
#opts.two{display:grid;grid-template-columns:1fr 1fr}
#opts button{flex:1;min-height:66px;border-radius:16px;background:#4A8BEA;color:#fff;font-size:clamp(24px,7vw,36px);font-weight:800;display:flex;align-items:center;justify-content:center;padding:4px}
#opts button.good{background:#5AC86E}
#opts button.bad{background:#E85C5C;opacity:.7}
#opts button:active{transform:scale(.97)}
#opts svg{display:block}
#next{display:none;margin:4px auto 0;min-height:60px;min-width:60%;border-radius:16px;background:#5AC86E;color:#fff;font-size:26px;font-weight:800}
#sum{display:none;text-align:center}
#sum .big{font-size:26px;font-weight:800;margin:10px 0}
#sum .mid{font-size:17px;margin:8px 0}
#sum .win{color:#2E9B47;font-weight:800}
.mbtn{display:block;width:100%;min-height:52px;margin:8px 0;border-radius:14px;background:#4A8BEA;color:#fff;font-size:18px;font-weight:700}
.mbtn.r{background:#EB4646}.mbtn.g{background:#aaa}.mbtn.g2{background:#5AC86E}
#code{width:100%;min-height:80px;border-radius:10px;border:2px solid #FFD9A0;padding:8px;font-size:13px;word-break:break-all;-webkit-user-select:text;user-select:text}
h2{margin:4px 0 8px;font-size:22px}
p.s{font-size:14px;color:#6b5a48;margin:6px 0}
#joy{display:none;position:fixed;left:calc(env(safe-area-inset-left) + 22px);bottom:calc(env(safe-area-inset-bottom) + 26px);width:132px;height:132px;border-radius:50%;background:rgba(255,248,230,.45);border:3px solid rgba(255,170,60,.8);touch-action:none;z-index:6}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#FFAA3C;box-shadow:0 2px 6px rgba(0,0,0,.3);pointer-events:none}
#act{display:none;position:fixed;right:calc(env(safe-area-inset-right) + 22px);bottom:calc(env(safe-area-inset-bottom) + 34px);min-width:150px;min-height:68px;padding:0 20px;border-radius:20px;background:#5AC86E;color:#fff;font-size:22px;font-weight:800;box-shadow:0 4px 10px rgba(0,0,0,.3);z-index:6}
@media (pointer:coarse){#joy{display:block}}
.lt{border-collapse:collapse;font-size:13px;margin:0 auto}
.lt th,.lt td{border:1px solid #E6C98A;padding:4px 7px;text-align:center;background:#fff}
.lt th{background:#FFF1CC;font-weight:700}
.lt td.no{color:#E94B4B;font-weight:800;font-size:16px}
.lt td.yes{color:#2E9B47;font-weight:800;font-size:16px}
.zb{position:fixed;right:calc(env(safe-area-inset-right) + 12px);width:44px;height:44px;border-radius:50%;background:rgba(255,248,230,.92);font-size:24px;font-weight:800;color:#46372a;z-index:6;box-shadow:0 2px 6px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;padding:0}
#zin{top:50%;margin-top:-50px}
#zout{top:50%;margin-top:4px}
#mapwrap{max-width:260px;margin:6px auto}
.mrow{display:flex;justify-content:space-between;gap:10px;padding:6px 4px;border-top:1px solid #E6C98A;font-size:14px}
#mapov .card{max-width:420px}
@media (max-width:420px){.pill{font-size:13px;padding:6px 10px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">
  <span class="pill" id="cr"></span>
  <span class="pill" id="lv"></span>
  <span class="pill" id="st"></span>
  <span class="sp"></span>
  <button id="mapBtn" aria-label="Карта">Карта</button>
  <button id="menuBtn" aria-label="Меню">Меню</button>
</div>
<button class="zb" id="zin" aria-label="Приблизить">+</button>
<button class="zb" id="zout" aria-label="Отдалить">−</button>
<div id="joy"><div id="knob"></div></div>
<button id="act"></button>
<div id="toast"></div>
<div class="ov" id="panel"><div class="card">
  <div id="phead">
    <div><div id="ptitle"></div><div id="pcount"></div></div>
    <div id="pstars"></div>
    <button id="close" aria-label="Закрыть">Закрыть ✕</button>
  </div>
  <div id="dots"></div>
  <div id="play">
    <div id="prompt"></div>
    <div id="vis"></div>
    <div id="msg"></div>
    <div id="opts"></div>
    <button id="next">Дальше ▶</button>
  </div>
  <div id="sum">
    <div id="sumtext"></div>
    <button class="mbtn g2" id="again">Ещё раунд</button>
    <button class="mbtn" id="sumclose">Закрыть</button>
  </div>
</div></div>
<div class="ov" id="mapov"><div class="card">
  <button id="mapclose" class="mbtn r" aria-label="Закрыть">Закрыть ✕</button>
  <h2>Карта</h2>
  <div id="mapwrap"></div>
  <div id="maplist"></div>
</div></div>
<div class="ov" id="menu"><div class="card">
  <button id="mclose" class="mbtn r" aria-label="Закрыть">Закрыть ✕</button>
  <h2>Меню</h2>
  <button class="mbtn g" id="snd"></button>
  <p class="s">Прогресс хранится в этом браузере. Чтобы перенести на другое устройство: покажи код, скопируй, на другом устройстве вставь и нажми «Загрузить».</p>
  <textarea id="code" placeholder="Код прогресса"></textarea>
  <button class="mbtn" id="showCode">Показать код</button>
  <button class="mbtn" id="loadCode">Загрузить код</button>
  <button class="mbtn r" id="reset">Начать заново</button>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/*TASKS_START*/
var MINUS="−";
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[ri(0,a.length-1)];}
function shuffle(l){for(var i=l.length-1;i>0;i--){var j=ri(0,i);var t=l[i];l[i]=l[j];l[j]=t;}return l;}
function plural(n,one,few,many){var m=n%100,k=n%10;if(m>=11&&m<=14)return many;if(k===1)return one;if(k>=2&&k<=4)return few;return many;}
function numOpts(correct,lo,hi,count,extra){
  count=count||4;var used={};used[correct]=1;var vals=[correct],tries=0,i;
  (extra||[]).forEach(function(v){if(!used[v]&&v>=lo&&v<=hi&&vals.length<count){used[v]=1;vals.push(v);}});
  while(vals.length<count&&tries<80){tries++;var d=ri(1,3);if(ri(0,1))d=-d;var v=correct+d;if(v>=lo&&v<=hi&&!used[v]){used[v]=1;vals.push(v);}}
  var f=lo;while(vals.length<count&&f<=hi+8){if(!used[f]){used[f]=1;vals.push(f);}f++;}
  shuffle(vals);
  return {opts:vals.map(function(v){return {t:String(v)};}),ans:vals.indexOf(correct)};
}
function txtOpts(correct,others,count){
  var pool=others.filter(function(x,i,a){return x!==correct&&a.indexOf(x)===i;});shuffle(pool);
  var vals=[correct].concat(pool.slice(0,(count||4)-1));shuffle(vals);
  return {opts:vals.map(function(v){return {t:v};}),ans:vals.indexOf(correct)};
}

var SHAPE_NAMES={circle:"круг",triangle:"треугольник",square:"квадрат",rectangle:"прямоугольник"};
var SHAPE_SIDES={circle:0,triangle:3,square:4,rectangle:4};
var COLORS={red:"#E94B4B",blue:"#3F7FE0",green:"#4FB84F",yellow:"#F2B90F",purple:"#9B6BD6",orange:"#F08A2A"};
var COLOR_KEYS=["red","blue","green","yellow","purple","orange"];
function shapeSvg(shape,col,sz){
  sz=sz||44;var c=COLORS[col]||col;
  var s='<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 44 44" aria-hidden="true">';
  if(shape==="circle")s+='<circle cx="22" cy="22" r="18" fill="'+c+'"/>';
  else if(shape==="square")s+='<rect x="5" y="5" width="34" height="34" rx="3" fill="'+c+'"/>';
  else if(shape==="rectangle")s+='<rect x="2" y="11" width="40" height="22" rx="3" fill="'+c+'"/>';
  else if(shape==="triangle")s+='<polygon points="22,4 41,38 3,38" fill="'+c+'"/>';
  else if(shape==="star")s+='<polygon points="22,3 27,16 41,16 30,25 34,39 22,31 10,39 14,25 3,16 17,16" fill="'+c+'"/>';
  return s+'</svg>';
}
function clockSvg(h,m){
  var s='<svg width="150" height="150" viewBox="0 0 150 150" role="img" aria-label="Часы"><circle cx="75" cy="75" r="70" fill="#fff" stroke="#46372a" stroke-width="5"/>';
  for(var i=1;i<=12;i++){var a=i*Math.PI/6;s+='<text x="'+(75+Math.sin(a)*56).toFixed(1)+'" y="'+(80-Math.cos(a)*56).toFixed(1)+'" text-anchor="middle" font-size="16" font-weight="700" fill="#46372a">'+i+'</text>';}
  var ha=((h%12)+m/60)*Math.PI/6,ma=m*Math.PI/30;
  s+='<line x1="75" y1="75" x2="'+(75+Math.sin(ha)*34).toFixed(1)+'" y2="'+(75-Math.cos(ha)*34).toFixed(1)+'" stroke="#E94B4B" stroke-width="7" stroke-linecap="round"/>';
  s+='<line x1="75" y1="75" x2="'+(75+Math.sin(ma)*52).toFixed(1)+'" y2="'+(75-Math.cos(ma)*52).toFixed(1)+'" stroke="#3F7FE0" stroke-width="4" stroke-linecap="round"/><circle cx="75" cy="75" r="5" fill="#46372a"/></svg>';
  return s;
}
function rulerSvg(max,bars){
  var w=(max+1)*34,h=bars.length*26+40;
  var s='<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Линейка" style="max-width:100%;height:auto">';
  bars.forEach(function(b,i){s+='<rect x="'+(17+b.s*34)+'" y="'+(4+i*26)+'" width="'+((b.e-b.s)*34)+'" height="20" rx="4" fill="'+b.c+'"/>';});
  var y0=bars.length*26+6;
  s+='<rect x="17" y="'+y0+'" width="'+(max*34)+'" height="30" fill="#FFE8A8" stroke="#46372a" stroke-width="2"/>';
  for(var i=0;i<=max;i++){var x=17+i*34;s+='<line x1="'+x+'" y1="'+y0+'" x2="'+x+'" y2="'+(y0+(i%5===0?16:11))+'" stroke="#46372a" stroke-width="2"/><text x="'+x+'" y="'+(y0+27)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#46372a">'+i+'</text>';}
  return s+'</svg>';
}

var GEN={};

GEN.count=function(T){
  if(T===1){var n=ri(3,10),o=numOpts(n,0,13);
    return {prompt:"Сколько яблок?",vis:{k:"rows",n:n,e:"🍎",per:5},opts:o.opts,ans:o.ans,hint:"Считай по одному. В каждой строке по 5 яблок."};}
  if(T===2){var a=ri(3,9),b=ri(3,9);while(b===a)b=ri(3,9);var red=ri(0,1)===0,o2=numOpts(red?a:b,0,12);
    return {prompt:"Сколько "+(red?"красных":"зелёных")+" яблок?",vis:{k:"scatter",items:[{e:"🍎",n:a},{e:"🍏",n:b}],numFor:red?0:1},opts:o2.opts,ans:o2.ans,hint:"Считай только "+(red?"красные":"зелёные")+" яблоки."};}
  var a3=ri(4,9),b3=ri(4,9),o3=numOpts(a3+b3,3,21);
  return {prompt:"Сколько всего яблок?",vis:{k:"scatter",items:[{e:"🍎",n:a3},{e:"🍏",n:b3}],numFor:-1},opts:o3.opts,ans:o3.ans,hint:"Посчитай красные, потом зелёные и сложи."};
};

GEN.cmp=function(T){
  var vert=ri(0,1)===0,mx=T===1?8:(T===2?12:14);
  var A=vert?"Сверху":"Слева",B=vert?"Снизу":"Справа";
  var a=ri(1,mx),b=ri(1,mx);if(ri(1,10)===1)b=a;
  if(T===3&&ri(0,1)===0){
    if(a===b)b=Math.max(1,a-ri(1,3));
    if(a<b){var t=a;a=b;b=t;}
    if(a===b)a=Math.min(mx,b+2);
    var o=numOpts(a-b,0,mx);
    return {prompt:"На сколько яблок "+(vert?"сверху":"слева")+" больше, чем "+(vert?"снизу":"справа")+"?",vis:{k:"cmp",dir:vert?"v":"h",a:a,b:b,e:"🍎"},opts:o.opts,ans:o.ans,hint:"Посчитай яблоки в обеих коробках и вычти меньшее из большего."};
  }
  var less=T>=2&&ri(0,1)===0;
  var ans=a===b?2:(less?(a<b?0:1):(a>b?0:1));
  return {prompt:less?"Где яблок меньше?":"Где яблок больше?",vis:{k:"cmp",dir:vert?"v":"h",a:a,b:b,e:"🍎"},opts:[{t:A},{t:B},{t:"Поровну"}],ans:ans,hint:"Посчитай яблоки в каждой коробке и сравни числа."};
};

GEN.math=function(T){
  var a,b,c,p,o,f;
  if(T===1){
    if(ri(0,1)){a=ri(1,9);b=ri(1,10-a);c=a+b;p=a+" + "+b+" = ?";}
    else{a=ri(2,10);b=ri(1,a-1);c=a-b;p=a+" "+MINUS+" "+b+" = ?";}
    o=numOpts(c,0,13);return {prompt:p,vis:{k:"none"},opts:o.opts,ans:o.ans,hint:"Посчитай на пальцах или нарисуй палочки."};
  }
  if(T===2){
    f=ri(0,2);
    if(f===0){a=ri(6,9);b=ri(11-a,9);c=a+b;p=a+" + "+b+" = ?";}
    else if(f===1){a=ri(11,18);b=ri(a-9,9);c=a-b;p=a+" "+MINUS+" "+b+" = ?";}
    else{a=ri(3,9);b=ri(2,9);c=b;p=a+" + ? = "+(a+b);}
    o=numOpts(c,0,20);return {prompt:p,vis:{k:"none"},opts:o.opts,ans:o.ans,hint:f===2?"Сколько нужно добавить к "+a+", чтобы получилось "+(a+b)+"?":"Сначала дополни до 10, потом прибавь (или отними) остаток."};
  }
  f=ri(0,2);
  if(f===0){var x=ri(3,12),y=ri(3,8);p="? + "+y+" = "+(x+y);o=numOpts(x,0,20);return {prompt:p,vis:{k:"none"},opts:o.opts,ans:o.ans,hint:"Какое число плюс "+y+" даёт "+(x+y)+"? Отними "+y+" от "+(x+y)+"."};}
  if(f===1){var cc=ri(10,20),xx=ri(3,cc-3);p=cc+" "+MINUS+" ? = "+(cc-xx);o=numOpts(xx,0,20);return {prompt:p,vis:{k:"none"},opts:o.opts,ans:o.ans,hint:"Сколько нужно отнять от "+cc+", чтобы осталось "+(cc-xx)+"?"};}
  var a1=ri(2,9),b1=ri(2,9),c1=ri(8,18),d1=ri(2,Math.min(9,c1-1));
  var e1=a1+b1,e2=c1-d1;
  return {prompt:a1+" + "+b1+"  ?  "+c1+" "+MINUS+" "+d1,vis:{k:"none"},opts:[{t:"<"},{t:">"},{t:"="}],ans:e1<e2?0:(e1>e2?1:2),hint:"Сначала вычисли каждую часть, потом сравни числа."};
};

GEN.sign=function(T){
  var a,b,c,o;
  if(T===3&&ri(0,1)===0){
    a=ri(10,20);b=ri(10,20);if(ri(1,6)===1)b=a;
    return {prompt:a+"  ?  "+b,vis:{k:"none"},opts:[{t:"<"},{t:">"},{t:"="}],ans:a<b?0:(a>b?1:2),hint:"Сравни числа: какое из них больше?"};
  }
  var mx=T===1?10:20,plus=ri(0,1)===0;

  (function rec(a,rest){if(!rest.length){res.push(a);return;}for(var i=0;i<rest.length;i++)rec(a.concat([rest[i]]),rest.slice(0,i).concat(rest.slice(i+1)));})([],Array.apply(null,Array(n)).map(function(_,i){return i;}));

function levelInfo(cr){
  var l=0;while(l+1<LEVELS.length&&cr>=LEVELS[l+1])l++;

  return {level:l+1,cur:cr-LEVELS[l],need:next?next-LEVELS[l]:0,max:!next};
}
function petCount(){return Math.min(9,levelInfo(state.crystals).level-1);}
function stationStars(k){return state.stars[k]||0;}
function islandStars(n){var t=0;STATIONS.forEach(function(s){if(s.island===n&&s.types&&s.k!=="chest")t+=stationStars(s.k);});return t;}
function islandOpen(n){return islandStars(n)>=ISLANDS[n-1].need;}
function reachable(n){return n===1||islandOpen(n-1);}
function target(){
  for(var i=0;i<ISLANDS.length;i++){var s=islandStars(i+1);if(s<ISLANDS[i].need)return {isl:ISLANDS[i],s:s,last:i===ISLANDS.length-1};}

function scatterEl(items,numFor,hint){
  var all=[],i;
  items.forEach(function(g,gi){var cnt=g.n!=null?g.n:1;for(var j=0;j<cnt;j++)all.push({e:g.e,svg:g.svg,gi:gi});});
  shuffle(all);var N=all.length,cols=Math.min(7,Math.ceil(Math.sqrt(N*1.8))),rows=Math.ceil(N/cols);
  var cells=[];for(i=0;i<cols*rows;i++)cells.push(i);shuffle(cells);cells=cells.slice(0,N).sort(function(a,b){return a-b;});
  var h=Math.max(90,rows*40+8),box=el("div","scatter");box.style.height=h+"px";

var R=null,badRun=0;
function buildOpts(t){
  var o=$("opts");o.innerHTML="";
  var many=t.opts.some(function(x){return x.svg||x.big||(x.t&&x.t.length>5);});
  o.className=many?"two":"row";
  t.opts.forEach(function(op,i){
    var b=document.createElement("button");
    if(op.svg)b.innerHTML=op.svg;else b.textContent=op.t;
    if(op.big)b.style.fontSize="38px";
    if(op.t&&op.t.length>9)b.style.fontSize="clamp(15px,4.3vw,22px)";
    b.addEventListener("click",function(){answer(i,b);});
    o.appendChild(b);
  });
}
function drawHead(){
  $("ptitle").textContent=R.s.title;
  $("pstars").textContent=starStr(stationStars(R.s.k));
  var d=$("dots");d.innerHTML="";
  for(var i=0;i<ROUND_LEN;i++){var x=el("span","dt"+(R.dots[i]===1?" ok":(R.dots[i]===2?" bad":(i===R.idx?" cur":""))));d.appendChild(x);}
  $("pcount").textContent="Задание "+Math.min(R.idx+1,ROUND_LEN)+" из "+ROUND_LEN;
}
function startRound(s){
  var stars=stationStars(s.k);
  R={s:s,idx:0,ok:0,dots:[],tier:s.k==="chest"?(stars>0?3:2):Math.min(3,stars+1),t:null,tries:0,locked:false,lastType:null,gained:0,
     open0:ISLANDS.map(function(i){return islandOpen(i.n);})};
  $("sum").style.display="none";$("play").style.display="block";
  $("panel").classList.add("on");
  nextTask();
}
function nextTask(){
  if(R.idx>=ROUND_LEN){finishRound();return;}
  var types=R.s.types.slice();
  if(R.lastType&&types.length>1)types=types.filter(function(x){return x!==R.lastType;});
  var ty=pickType(types,state.stat);R.lastType=ty;
  R.t=makeTask(ty,R.tier);R.tries=0;R.locked=false;
  drawHead();
  $("prompt").textContent=R.t.prompt;
  var pre=badRun>=2;
  drawVis(R.t.vis,pre);
  $("msg").textContent=pre?"Давай разберём вместе. "+R.t.hint:"";
  $("msg").className="";
  buildOpts(R.t);
  $("next").style.display="none";$("opts").style.display="";
}
function answer(i,btn){
  if(!R||R.locked)return;
  R.tries++;
  var t=R.t,ok=i===t.ans,st=state.stat[t.type]||(state.stat[t.type]={ok:0,bad:0});
  if(ok){
    var gain=R.tries===1?2:1,before=levelInfo(state.crystals).level;
    state.crystals+=gain;R.ok++;R.gained+=gain;R.dots[R.idx]=1;
    if(R.tries===1){st.ok++;badRun=0;}
    R.locked=true;btn.className="good";
    var li=levelInfo(state.crystals);
    $("msg").className="good";
    $("msg").textContent="Верно! +"+gain+" 💎"+(li.max?"":" · до уровня "+(li.level+1)+": ещё "+(li.need-li.cur));
    beep([660,880]);save();hud();drawHead();
    if(li.level>before){toast("Новый уровень "+li.level+"! У тебя новый питомец.",4);beep([660,880,1100]);}
    $("opts").style.display="none";$("next").textContent=R.idx+1>=ROUND_LEN?"Закончить ▶":"Дальше ▶";$("next").style.display="block";
  }else{
    btn.className="bad";btn.disabled=true;
    if(R.tries===1){st.bad++;badRun++;}
    if(R.tries>=2){
      R.locked=true;R.dots[R.idx]=2;beep([260]);save();drawHead();
      var right=t.opts[t.ans];
      $("msg").className="";
      $("msg").textContent="Правильный ответ: "+(right.t||"этот")+". Ничего страшного, пойдём дальше!";
      drawVis(t.vis,true);
      $("opts").style.display="none";$("next").textContent=R.idx+1>=ROUND_LEN?"Закончить ▶":"Дальше ▶";$("next").style.display="block";
    }else{
      beep([260]);save();
      $("msg").className="";
      $("msg").textContent="Почти! Подсказка: "+t.hint;
      drawVis(t.vis,true);
    }
  }
}
function finishRound(){
  var s=R.s,cur=stationStars(s.k),got=false;
  if(R.ok>=STAR_NEED&&cur<3){state.stars[s.k]=cur+1;got=true;}
  save();
  var news=[];
  ISLANDS.forEach(function(isl,idx){
    if(!R.open0[idx]&&islandOpen(isl.n))news.push(idx<ISLANDS.length-1?"Мост починен! Открыт «"+ISLANDS[idx+1].name+"».":"Сундук сокровищ открыт!");
  });
  var tg=target(),html="";
  html+='<div class="big">'+(got?"Звезда получена! ⭐":(R.ok>=STAR_NEED?"Отлично! Тренировка пройдена":"Почти получилось!"))+'</div>';
  html+='<div class="mid">Верных ответов: <b>'+R.ok+' из '+ROUND_LEN+'</b> · Получено: <b>+'+R.gained+' 💎</b></div>';
  html+='<div class="mid">Звёзды здесь: '+starStr(stationStars(s.k))+'</div>';
  if(!got&&R.ok<STAR_NEED)html+='<div class="mid">Чтобы получить звезду, нужно '+STAR_NEED+' верных ответа из '+ROUND_LEN+'. Попробуй ещё раз, задания будут другие.</div>';
  if(!got&&R.ok>=STAR_NEED)html+='<div class="mid">Здесь уже все 3 звезды. Можно тренироваться и копить 💎.</div>';
  if(s.k!=="chest")html+='<div class="mid">'+(tg?"На острове: ⭐ "+tg.s+" из "+tg.isl.need+" до следующего моста":"Все мосты починены!")+'</div>';
  news.forEach(function(n){html+='<div class="mid win">'+n+'</div>';});
  $("sumtext").innerHTML=html;
  $("play").style.display="none";$("sum").style.display="block";
  $("pstars").textContent=starStr(stationStars(s.k));
  beep(got?[660,880,1100]:[440,550]);
  hud();
  if(news.length)toast(news.join(" "),6);
}

}

function free(x,z){
  if(!walkable(x,z))return false;
  for(var i=0;i<circles.length;i++){var c=circles[i];if(Math.hypot(x-c.x,z-c.z)<c.r+1.2)return false;}
  return true;
}
function tryMove(dx,dz){
  var x=pl.position.x,z=pl.position.z;
  if(free(x+dx,z+dz)){x+=dx;z+=dz;}
  else if(free(x+dx,z)){x+=dx;}
  else if(free(x,z+dz)){z+=dz;}
  pl.position.x=x;pl.position.z=z;
}

function joyMove(e){

  var cx=r.left+r.width/2,cy=r.top+r.height/2,m=r.width/2;
  var dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy);
  if(d>m){dx=dx/d*m;dy=dy/d*m;}
  $("knob").style.transform="translate("+dx+"px,"+dy+"px)";

}

function buildIsland(isl,idx){
  var grp=new THREE.Group();scene.add(grp);islandGroups[idx]=grp;cur=grp;

  var sandTop=tm("sand"+idx,128,128,function(c,w,h){

    for(var i=0;i<200;i++){c.fillStyle=(i%2)?"#F2CF82":"#FFEDB8";c.fillRect(r()*w,r()*h,2,2);}
  },(sz+16)/4);
  var topCss=hexCss(top),lightCss=hexCss(shadeHex(top,1.15)),darkCss=hexCss(shadeHex(top,0.85));
  var grassTop=tm("grass"+idx,128,128,function(c,w,h){
    c.fillStyle=topCss;c.fillRect(0,0,w,h);var r=mkRand(9+idx);
    for(var i=0;i<220;i++){c.strokeStyle=(i%3===0)?lightCss:darkCss;c.lineWidth=2;var x=r()*w,y=r()*h;c.beginPath();c.moveTo(x,y);c.lineTo(x+(r()-0.5)*4,y-4-r()*5);c.stroke();}
  },sz/4);
  var sandSide=mat(0xE8CF8A),grassSide=mat(shadeHex(top,0.88));
  box(sz+16,7,sz+16,faces(sandSide,sandTop,sandSide,sandSide,sandSide),isl.cx,-3.3,isl.cz);
  box(sz,0.8,sz,faces(grassSide,grassTop,grassSide,grassSide,grassSide),isl.cx,0,isl.cz);

  var leaf=[0x5FC855,0x3F9A45,0x7FD04A,0x4FB878,0x6FC060][idx];
  var clear=[];
  STATIONS.forEach(function(st){if(st.island===isl.n)clear.push([st.x,st.z]);});
  clear.push([isl.cx,isl.cz+half-4]);clear.push([isl.cx,isl.cz-half+4]);

  if(idx===0){
    var pad=new THREE.Mesh(new THREE.CylinderGeometry(5,5,0.3,24),mat(0xFFC864));pad.position.set(0,0.55,26);grp.add(pad);
    var pond=new THREE.Mesh(new THREE.CylinderGeometry(12,12,0.5,32),mat(0x46AAEB));pond.position.set(46,0.5,-8);grp.add(pond);
    box(3,10,3,0xB8C0CC,-8,5.4,-40);box(3,10,3,0xB8C0CC,8,5.4,-40);box(19,2,3,0xFFD93D,0,11.4,-40);
    circles.push({x:-8,z:-40,r:2.2});circles.push({x:8,z:-40,r:2.2});
    clear.push([46,-8],[0,26],[0,-36],[-8,-40],[8,-40]);
  }
  if(idx===2){
    var tx=-32,tz=-205;
    box(4,12,4,0xC9CED6,tx,6.4,tz);
    var cm=tm("towerclock",128,128,function(c,w,h){
      c.fillStyle="#fff";c.fillRect(0,0,w,h);c.fillStyle="#fff";c.beginPath();c.arc(64,64,60,0,Math.PI*2);c.fill();
      c.strokeStyle="#46372a";c.lineWidth=6;c.stroke();c.lineWidth=3;
      for(var i=0;i<12;i++){var a=i*Math.PI/6;c.beginPath();c.moveTo(64+Math.sin(a)*48,64-Math.cos(a)*48);c.lineTo(64+Math.sin(a)*56,64-Math.cos(a)*56);c.stroke();}
      c.lineWidth=7;c.strokeStyle="#E94B4B";c.beginPath();c.moveTo(64,64);c.lineTo(64+Math.sin(5*Math.PI/6)*28,64-Math.cos(5*Math.PI/6)*28);c.stroke();
      c.lineWidth=4;c.strokeStyle="#3F7FE0";c.beginPath();c.moveTo(64,64);c.lineTo(64+Math.sin(Math.PI/3)*44,64-Math.cos(Math.PI/3)*44);c.stroke();
    });
    var face=new THREE.Mesh(new THREE.CylinderGeometry(2.6,2.6,0.4,28),[mat(0x8A6A4A),cm,mat(0x8A6A4A)]);
    face.rotation.x=Math.PI/2;face.position.set(tx,9,tz+2.1);grp.add(face);
    circles.push({x:tx,z:tz,r:3.2});clear.push([tx,tz]);
  }
  if(idx===1){
    var rm=mkRand(61);
    for(var m=0;m<12;m++){
      var mx=rm()*44-22,mz=-120+rm()*44-22;
      box(0.6,1,0.6,0xF5EBDD,mx,0.9,mz);
      box(1.8,0.5,1.8,0xE94B4B,mx,1.6,mz);
      box(0.4,0.15,0.4,0xFFFFFF,mx+0.4,1.9,mz);
    }
  }

  var counts=[24,30,6,8,8],rnd=mkRand(7+idx*13),placed=0,tries=0,span=sz-12;
  while(placed<counts[idx]&&tries<600){
    tries++;
    var x=isl.cx+Math.round(rnd()*span-span/2),z=isl.cz+Math.round(rnd()*span-span/2),ok=true;
    for(var j=0;j<clear.length;j++){if(Math.hypot(x-clear[j][0],z-clear[j][1])<(idx===0?15:13)){ok=false;break;}}
    for(var q=0;ok&&q<circles.length;q++){if(Math.hypot(x-circles[q].x,z-circles[q].z)<5)ok=false;}

  if(idx===0){makeTree(-44,-2,1,true,leaf);makeTree(-42,-16,1,true,leaf);makeTree(-26,-14,1,true,leaf);}

  var fc=[0xFF6B6B,0xFFD93D,0xFFFFFF,0xFF82BE,0x9B7BFF],fl=idx===0?55:20;
  for(var f=0;f<fl;f++){
    var fx=isl.cx+rnd()*(sz-6)-(sz-6)/2,fz=isl.cz+rnd()*(sz-6)-(sz-6)/2,near2=false;
    for(var q2=0;q2<circles.length;q2++){if(Math.hypot(fx-circles[q2].x,fz-circles[q2].z)<circles[q2].r+2){near2=true;break;}}
    if(near2)continue;
    box(0.15,0.7,0.15,0x3E9B3A,fx,0.75,fz);
    box(0.6,0.25,0.6,fc[f%fc.length],fx,1.2,fz);
  }

  STATIONS.forEach(function(st){if(st.island===isl.n)makeNpc(st);});
  cur=scene;
}

var bridges=[];

}
function updateBridges(){

function updateLabels(){

function walkable(x,z){
  var i;
  for(i=0;i<ISLANDS.length;i++){
    var I=ISLANDS[i],h=I.size/2-1;
    if(Math.abs(x-I.cx)<=h&&Math.abs(z-I.cz)<=h)return true;
  }
  for(i=1;i<=4;i++){
    if(islandOpen(i)){
      var zs=ISLANDS[i-1].cz-ISLANDS[i-1].size/2;
      if(Math.abs(x)<=3.5&&z<=zs+2&&z>=zs-32)return true;
    }
  }
  return false;
}

function syncPets(){
  var want=petCount();
  while(pets.length<want){
    var i=pets.length,g=new THREE.Group();
    var ball=new THREE.Mesh(new THREE.SphereGeometry(1.1,12,10),mat(parseInt(PETCOL[i].slice(1),16)));g.add(ball);
    var sp=numSprite(i+1,PETCOL[i]);sp.position.set(0,2.2,0);g.add(sp);
    g.position.copy(pl.position);scene.add(g);pets.push(g);
  }
  while(pets.length>want){scene.remove(pets.pop());}
}
var PETCOL=["#FF6B6B","#FFA03C","#E6B800","#5AC86E","#50BEF0","#9B7BFF","#FF82BE","#3CC8B4","#9A9AA2"];
function onState(){
  if(!ready3d)return;
  updateBridges();updateLabels();syncPets();
  if($("mapov").classList.contains("on"))drawMap();
}

function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(0.05,(now-lastT)/1000);lastT=now;
  var t=now/1000,i;
  var locked=isLocked();
  var ix=0,iy=0;
  if(!locked){
    ix=joy.x+((keys.d||keys.right)?1:0)-((keys.a||keys.left)?1:0);
    iy=joy.y+((keys.w||keys.up)?1:0)-((keys.s||keys.down)?1:0);
  }
  var len=Math.hypot(ix,iy);
  if(len>1){ix/=len;iy/=len;len=1;}
  var moving=len>0.12;
  if(moving){
    var mx=-Math.sin(yaw)*iy+Math.cos(yaw)*ix;
    var mz=-Math.cos(yaw)*iy-Math.sin(yaw)*ix;
    tryMove(mx*14*len*dt,mz*14*len*dt);
    var target2=Math.atan2(mx,mz);
    var diff=Math.atan2(Math.sin(target2-pl.rotation.y),Math.cos(target2-pl.rotation.y));
    pl.rotation.y+=diff*Math.min(1,dt*12);
  }
  swing+=((moving?1:0)-swing)*Math.min(1,dt*10);
  phase+=dt*(moving?12:0);
  var sw=Math.sin(phase)*0.9*swing;
  plLegL.rotation.x=sw;plLegR.rotation.x=-sw;plArmL.rotation.x=-sw;plArmR.rotation.x=sw;
  plShadow.position.set(pl.position.x,0.5,pl.position.z);

  var a=pl.rotation.y,ca=Math.cos(a),sa=Math.sin(a);
  for(i=0;i<pets.length;i++){
    var lx=((i%3)-1)*3,lz=-(4+Math.floor(i/3)*3);
    var tx=pl.position.x+lx*ca+lz*sa,tz=pl.position.z-lx*sa+lz*ca;
    var p=pets[i];
    p.position.x+=(tx-p.position.x)*Math.min(1,dt*5);
    p.position.z+=(tz-p.position.z)*Math.min(1,dt*5);
    p.position.y=2.4+Math.sin(t*2+i)*0.4;
  }

  for(i=0;i<ISLANDS.length;i++){islandGroups[i].visible=Math.abs(pl.position.z-ISLANDS[i].cz)<190;}
  for(i=1;i<=4;i++){bridges[i].grp.visible=Math.abs(pl.position.z-(bridges[i].zs-15))<170;}
  for(i=0;i<STATIONS.length;i++){
    var g=STATIONS[i].group;
    if(!g.parent.visible)continue;
    g.userData.head.rotation.z=Math.sin(t*2+g.userData.phase)*0.08;
    g.scale.y=g.userData.sc*(1+Math.sin(t*2.4+g.userData.phase)*0.015);
  }
  if(seaTex){seaTex.offset.x+=dt*0.012;seaTex.offset.y+=dt*0.008;}
  for(i=0;i<clouds.length;i++){clouds[i].position.x+=dt*2;if(clouds[i].position.x>230)clouds[i].position.x=-230;}

  var nn=null,nd=9;
  if(!locked){
    for(i=0;i<STATIONS.length;i++){
      var d=Math.hypot(pl.position.x-STATIONS[i].x,pl.position.z-STATIONS[i].z);
      if(d<nd){nd=d;nn=STATIONS[i];}
    }
  }
  if(nn!==near){
    near=nn;var btn=$("act");
    if(near){btn.textContent=near.act;btn.style.display="block";}else{btn.style.display="none";}
  }

  var R2=(camera.aspect<1?32:24)*zoomF,H2=(camera.aspect<1?20:16)*zoomF;
  var look=new THREE.Vector3(pl.position.x,3.5,pl.position.z);
  var want=new THREE.Vector3(look.x+Math.sin(yaw)*R2,look.y+H2,look.z+Math.cos(yaw)*R2);
  camera.position.lerp(want,Math.min(1,dt*6));
  camera.lookAt(look);
  renderer.render(scene,camera);
}

function init3D(){
  if(typeof THREE==="undefined"){toast("Не загрузилась 3D-библиотека. Нужен интернет, обнови страницу.",12);return;}
  try{renderer=new THREE.WebGLRenderer({canvas:$("gl"),antialias:true});}
  catch(e){toast("Этот браузер не поддерживает 3D.",12);return;}
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x8FD3FF);
  scene.fog=new THREE.Fog(0x8FD3FF,150,330);
  camera=new THREE.PerspectiveCamera(50,1,3,500);
  scene.add(new THREE.HemisphereLight(0xffffff,0x9ab88a,0.9));
  var sun=new THREE.DirectionalLight(0xffffff,0.6);sun.position.set(40,80,30);scene.add(sun);
  shMat=new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.22,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2});
  buildWorld();
  cur=scene;
  buildPlayer();
  resize();
  camera.position.set(pl.position.x,19.5,pl.position.z+24);
  window.addEventListener("resize",resize);
  window.addEventListener("orientationchange",function(){setTimeout(resize,200);});

  var jEl=$("joy");
  if("ontouchstart" in window)jEl.style.display="block";
  jEl.addEventListener("pointerdown",function(e){joyId=e.pointerId;jEl.setPointerCapture(e.pointerId);joyMove(e);e.preventDefault();});
  jEl.addEventListener("pointermove",function(e){if(e.pointerId===joyId)joyMove(e);});
  jEl.addEventListener("pointerup",joyEnd);
  jEl.addEventListener("pointercancel",joyEnd);

  var cv=$("gl");
  cv.addEventListener("pointerdown",function(e){
    ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
    try{cv.setPointerCapture(e.pointerId);}catch(err){}
    var ids=Object.keys(ptrs);
    if(ids.length===2){dragId=null;var a=ptrs[ids[0]],b=ptrs[ids[1]];pinch0=Math.hypot(a.x-b.x,a.y-b.y);pinchF0=zoomF;}
    else if(ids.length===1){dragId=e.pointerId;lastX=e.clientX;}
  });
  cv.addEventListener("pointermove",function(e){
    if(!ptrs[e.pointerId])return;
    ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
    var ids=Object.keys(ptrs);
    if(ids.length>=2&&pinch0>0){
      var a=ptrs[ids[0]],b=ptrs[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d>10)zoomF=Math.max(0.4,Math.min(2,pinchF0*pinch0/d));
    }else if(e.pointerId===dragId){yaw-=(e.clientX-lastX)*0.006;lastX=e.clientX;}
  });
  function ptrEnd(e){
    delete ptrs[e.pointerId];
    if(e.pointerId===dragId)dragId=null;
    var ids=Object.keys(ptrs);
    if(ids.length<2)pinch0=0;
    if(ids.length===1){dragId=Number(ids[0]);lastX=ptrs[ids[0]].x;}
  }
  cv.addEventListener("pointerup",ptrEnd);cv.addEventListener("pointercancel",ptrEnd);
  cv.addEventListener("wheel",function(e){e.preventDefault();zoomF=Math.max(0.4,Math.min(2,zoomF*(e.deltaY>0?1.1:0.9)));},{passive:false});
  document.addEventListener("gesturestart",function(e){e.preventDefault();});
  document.addEventListener("gesturechange",function(e){e.preventDefault();});
  $("zin").addEventListener("click",function(){zoomF=Math.max(0.4,zoomF*0.8);});
  $("zout").addEventListener("click",function(){zoomF=Math.min(2,zoomF*1.25);});

  var KEYMAP={KeyW:"w",KeyA:"a",KeyS:"s",KeyD:"d",ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"};
  window.addEventListener("keydown",function(e){
    if($("menu").classList.contains("on"))return;
    if(KEYMAP[e.code]){keys[KEYMAP[e.code]]=true;e.preventDefault();}
    else if((e.code==="KeyE"||e.code==="Space"||e.code==="Enter")&&near&&!isLocked()){e.preventDefault();stationClick(near);}
    else if(e.code==="Equal"||e.code==="NumpadAdd"){zoomF=Math.max(0.4,zoomF*0.85);}
    else if(e.code==="Minus"||e.code==="NumpadSubtract"){zoomF=Math.min(2,zoomF*1.18);}
  });
  window.addEventListener("keyup",function(e){if(KEYMAP[e.code])keys[KEYMAP[e.code]]=false;});
  window.addEventListener("blur",function(){keys={};});
  $("act").addEventListener("click",function(){if(near&&!isLocked())stationClick(near);});

  ready3d=true;
  lastT=performance.now();
  requestAnimationFrame(frame);
}

var MAPEMO={fox:"🦊",snail:"🐌",croc:"🐊",robot:"🤖",beaver:"🦫",owl:"🦉",bunny:"🐰",hedge:"🦔",cat:"🐱",monkey:"🐵",giraffe:"🦒",penguin:"🐧",parrot:"🦜",bear:"🐻",chest:"💎",raccoon:"🦝",elephant:"🐘",duck:"🦆",pig:"🐷"};
var MAP_ZMIN=-436,MAP_H=510,mapTimer=null;
function mapX(x){return x+75;}
function mapY(z){return z-MAP_ZMIN;}
function drawMap(){
  var h='<svg viewBox="0 0 150 '+MAP_H+'" role="img" aria-label="Карта островов" style="display:block;width:100%;max-height:60vh">';
  h+='<rect x="0" y="0" width="150" height="'+MAP_H+'" rx="10" fill="#8FD3FF"/>';
  ISLANDS.forEach(function(isl,idx){
    var half=isl.size/2,op=reachable(isl.n)?1:0.45;
    h+='<g opacity="'+op+'">';
    h+='<rect x="'+mapX(isl.cx-half-8).toFixed(1)+'" y="'+mapY(isl.cz-half-8).toFixed(1)+'" width="'+(isl.size+16)+'" height="'+(isl.size+16)+'" rx="12" fill="#FFE29A"/>';
    h+='<rect x="'+mapX(isl.cx-half).toFixed(1)+'" y="'+mapY(isl.cz-half).toFixed(1)+'" width="'+isl.size+'" height="'+isl.size+'" rx="8" fill="'+hexCss(isl.top)+'"/>';
    h+='<text x="'+mapX(isl.cx)+'" y="'+(mapY(isl.cz-half)+10)+'" text-anchor="middle" font-size="7.5" font-weight="700" fill="#2d4a2a">'+isl.n+'. '+isl.name+'</text>';
    if(!reachable(isl.n))h+='<text x="'+mapX(isl.cx)+'" y="'+(mapY(isl.cz)+6)+'" text-anchor="middle" font-size="22">🔒</text>';
    h+='</g>';
  });
  for(var b=1;b<=4;b++){
    var zs=ISLANDS[b-1].cz-ISLANDS[b-1].size/2,open=islandOpen(b);
    h+='<rect x="'+(mapX(0)-4)+'" y="'+mapY(zs-30)+'" width="8" height="30" fill="'+(open?"#BE8750":"#ffffff")+'" opacity="'+(open?1:0.7)+'" stroke="'+(open?"#7A5030":"#9aa")+'" stroke-width="1" '+(open?"":'stroke-dasharray="3 2"')+'/>';
    if(!open)h+='<text x="'+(mapX(0)+7)+'" y="'+(mapY(zs-14))+'" font-size="7.5" font-weight="700" fill="#46372a">⭐ '+ISLANDS[b-1].need+'</text>';
  }
  STATIONS.forEach(function(s){
    var st=stationStars(s.k),fill=!s.types?"#ffffff":(s.k==="chest"?"#FFD93D":["#EDEDED","#FFF0A8","#FFD84A","#FFB800"][st]);
    h+='<g data-k="'+s.k+'" style="cursor:pointer"><circle cx="'+mapX(s.x)+'" cy="'+mapY(s.z)+'" r="6.8" fill="'+fill+'" stroke="#46372a" stroke-width="0.9"/>';
    h+='<text x="'+mapX(s.x)+'" y="'+(mapY(s.z)+3.2)+'" text-anchor="middle" font-size="8.5">'+MAPEMO[s.kind]+'</text></g>';
  });
  h+='<g id="mpl"><polygon points="0,-8 6,6 0,3 -6,6" fill="#E94B4B" stroke="#fff" stroke-width="1.5"/></g>';
  h+='</svg>';
  $("mapwrap").innerHTML=h;
  var list="";
  ISLANDS.forEach(function(isl){
    var s=islandStars(isl.n),r=reachable(isl.n);
    list+='<div class="mrow"><span>'+(r?"":"🔒 ")+isl.n+'. '+isl.name+'</span><b>⭐ '+s+'/'+isl.need+(islandOpen(isl.n)?" ✓":"")+'</b></div>';
  });
  $("maplist").innerHTML=list;
  updateMapPlayer();
}
function updateMapPlayer(){
  var p=document.getElementById("mpl");
  if(!p||!pl)return;
  var deg=(Math.PI-pl.rotation.y)*180/Math.PI;
  p.setAttribute("transform","translate("+mapX(pl.position.x).toFixed(1)+","+mapY(pl.position.z).toFixed(1)+") rotate("+deg.toFixed(0)+")");
}
function openMap(){
  if($("panel").classList.contains("on")||$("menu").classList.contains("on"))return;
  drawMap();$("mapov").classList.add("on");
  clearInterval(mapTimer);mapTimer=setInterval(updateMapPlayer,200);
}
function closeMap(){$("mapov").classList.remove("on");clearInterval(mapTimer);mapTimer=null;}
$("mapBtn").addEventListener("click",openMap);
$("mapclose").addEventListener("click",closeMap);
$("mapov").addEventListener("click",function(e){if(e.target===this)closeMap();});
$("mapwrap").addEventListener("click",function(e){
  var t=e.target;
  while(t&&t!==this){
    if(t.getAttribute&&t.getAttribute("data-k")){
      var s=stationByKey(t.getAttribute("data-k"));
      toast(s.title+(s.types&&s.k!=="chest"?"  "+starStr(stationStars(s.k)):""),3);return;
    }
    t=t.parentNode;
  }
});
window.addEventListener("keydown",function(e){
  if(e.code==="KeyM"){if($("mapov").classList.contains("on"))closeMap();else openMap();}
});

if(!saveOk)toast("Браузер не даёт сохранять прогресс. Не используй приватный режим.",8);
load();init3D();hud();
if(ready3d)toast("Веди героя джойстиком (на компьютере: WASD). Подойди к другу и нажми кнопку. Нажми на ⭐ вверху, чтобы узнать цель.",6);
</script>
